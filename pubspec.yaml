name: atlendify_app
description: A Student Attendance Monitoring System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.2.0
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  crypto: ^3.0.3
  uuid: ^4.4.0
  intl: ^0.19.0
  mobile_scanner: ^5.2.3
  qr_flutter: ^4.1.0
  audioplayers: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0
  firebase_core: ^5.1.0
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/images/
    - assets/sounds/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon_full.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/android_foreground.png"
  monochrome_path: "assets/images/android_monochrome.png"

flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#0E1116"
  image: "assets/images/logo_mark.png"
  android_12:
    image: "assets/images/logo_mark.png"
    color: "#FFFFFF"
    color_dark: "#0E1116"